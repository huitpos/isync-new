openapi: 3.0.0

components:
  securitySchemes:
    bearerAuth:            # arbitrary name for the security scheme
      type: http
      scheme: bearer
      bearerFormat: JWT

security:
  - bearerAuth: []

info:
  title: iSync API

tags:
  - name: Auth
    description: Authentication endpoints
  - name: POS Machine
    description: Machine activation and device registration
  - name: Cashier
    description: Endpoints primarily used by Cashier machines
  - name: Order Station
    description: Endpoints primarily used by Order Station (take-order) machines
  - name: Cashier & Order Station
    description: Shared endpoints used by both Cashier and Order Station
  - name: Sync From Server
    description: Download/sync data from server to machine
  - name: Sync To Server
    description: Upload/sync data from machine to server


paths:
  /api/login:
    post:
      tags:
        - Cashier & Order Station
        - Auth
      summary: "Login"
      description: |
        Used by: Cashier & Order Station. Authenticate a POS user and return a bearer token for API access.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
              required:
                - email
                - password
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string

  /api/activate-machine:
    post:
      tags:
        - Cashier & Order Station
        - POS Machine
      summary: "Activate machine"
      description: |
        Used by: Cashier & Order Station. Register/activate a POS device using product key and device hardware details.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                product_key:
                  type: string
                serial:
                  type: string
                model:
                  type: string
                android_id:
                  type: string
                manufacturer:
                  type: string
                board:
                  type: string
              required:
                - product_key
                - serial
                - model
                - android_id
                - manufacturer
                - board
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string

  /api/companies/{companyId}:
    get:
      tags:
        - Cashier & Order Station
        - Sync From Server
      summary: "Get company"
      description: |
        Used by: Cashier & Order Station. Download company master data for the machine.
      parameters:
        - in: path
          name: companyId
          schema:
            type: integer
          required: true
          description: Numeric ID of the company to get
        - in: query
          name: device_id
          schema:
            type: integer
          required: true
          description: Numeric ID of the device
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string

  /api/branches/{branchId}:
