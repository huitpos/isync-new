                  type: integer
                cut_off_at:
                  type: string
                  default: null
                branch_id:
                  type: integer
                guest_name:
                  type: string
                is_resume_printed:
                  type: boolean
                treg:
                  type: string
                backout_at:
                  type: string
                  default: null
                total_quantity:
