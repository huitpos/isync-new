openapi: 3.0.0
info:
  title: iSync API
tags:
- name: Auth
  description: Authentication endpoints
- name: POS Machine
  description: Machine activation and device registration
- name: Cashier
  description: Endpoints primarily used by Cashier machines
- name: Order Station
  description: Endpoints primarily used by Order Station (take-order) machines
- name: Cashier & Order Station
  description: Shared endpoints used by both Cashier and Order Station
- name: SB
  description: Sales Buddy related endpoints
security:
- bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
paths:
  /api/login:
    post:
      tags:
      - Auth
      summary: Login
      description: |
        Used by: Cashier & Order Station. Authenticate a POS user and return a bearer token for API access.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - password
              properties:
                email:
                  type: string
                  description: Email or username
                password:
                  type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
  /api/activate-machine:
    post:
      tags:
      - POS Machine
      summary: Activate machine
      description: |
        Used by: Cashier & Order Station. Register/activate a POS device using product key and device hardware details.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                product_key:
                  type: string
                serial:
                  type: string
                model:
                  type: string
                android_id:
                  type: string
                manufacturer:
                  type: string
                board:
                  type: string
                device_id:
                  type: integer
                  description: POS device ID required by MachineValidationMiddleware (body or query).
              required:
              - product_key
              - serial
              - model
              - android_id
              - manufacturer
              - board
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
  /api/companies/{companyId}:
    get:
      tags:
      - Cashier & Order Station
      summary: Get company
      description: |
        Used by: Cashier & Order Station. Download company master data for the machine.
      parameters:
      - in: path
        name: companyId
        schema:
          type: integer
        required: true
        description: Numeric ID of the company to get
      - in: query
        name: device_id
        schema:
          type: integer
        required: true
        description: Numeric ID of the device
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
  /api/branches/{branchId}:
    get:
      tags:
      - Cashier & Order Station
      summary: Get branch
      description: |
        Used by: Cashier & Order Station. Download branch master data for the machine.
      parameters:
      - in: path
        name: branchId
        schema:
          type: integer
        required: true
        description: Numeric ID of the branch to get
      - in: query
        name: device_id
        schema:
          type: integer
        required: true
        description: Numeric ID of the device
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
  /api/test-connection:
    get:
      tags:
      - Cashier & Order Station
      summary: Test connection
      description: |
        Used by: Cashier & Order Station. Health check to verify the machine can reach the server.
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
  /api/cash-denominations:
    get:
      tags:
      - Cashier
      summary: Get cash denominations
      description: |
        Used by: Cashier. Download cash denomination setup used for cash counts and safekeeping.
      parameters:
      - in: query
        name: device_id
        schema:
          type: integer
        required: true
        description: Numeric ID of the device
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
  /api/departments/{branchId}:
    get:
      tags:
      - Cashier & Order Station
      summary: Get departments
      description: |
        Used by: Cashier & Order Station. Download department master list for the branch.
      parameters:
      - in: path
        name: branchId
        schema:
          type: integer
        required: true
        description: Numeric ID of the branch to get
      - in: query
        name: device_id
        schema:
          type: integer
        required: true
        description: Numeric ID of the device
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
  /api/categories/{branchId}:
    get:
      tags:
      - Cashier & Order Station
      summary: Get categories
      description: |
        Used by: Cashier & Order Station. Download category master list for the branch.
      parameters:
      - in: path
        name: branchId
        schema:
          type: integer
        required: true
        description: Numeric ID of the branch to get
      - in: query
        name: device_id
        schema:
          type: integer
        required: true
        description: Numeric ID of the device
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
  /api/sub-categories/{branchId}:
    get:
      tags:
      - Cashier & Order Station
      summary: Get sub-categories
      description: |
        Used by: Cashier & Order Station. Download sub-category master list for the branch.
      parameters:
      - in: path
        name: branchId
        schema:
          type: integer
        required: true
        description: Numeric ID of the branch to get
      - in: query
        name: device_id
        schema:
          type: integer
        required: true
        description: Numeric ID of the device
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
  /api/branch-users/{branchId}:
    get:
      tags:
      - Cashier & Order Station
      summary: Get branch users
      description: |
        Used by: Cashier & Order Station. Download branch users/cashiers allowed to log in on the machine.
      parameters:
      - in: path
        name: branchId
        schema:
          type: integer
        required: true
        description: Numeric ID of the branch to get
      - in: query
        name: device_id
        schema:
          type: integer
        required: true
        description: Numeric ID of the device
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
  /api/payment-types/{branchId}:
    get:
      tags:
      - Cashier
      summary: Get payment types
      description: |
        Used by: Cashier. Download available payment types for cashier checkout.
      parameters:
      - in: path
        name: branchId
        schema:
          type: integer
        required: true
        description: Numeric ID of the branch to get
      - in: query
        name: device_id
        schema:
          type: integer
        required: true
        description: Numeric ID of the device
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
  /api/discount-types/{branchId}:
    get:
      tags:
      - Cashier & Order Station
      summary: Get discount types
      description: |
        Used by: Cashier & Order Station. Download discount types that can be applied on transactions/orders.
      parameters:
      - in: path
        name: branchId
        schema:
          type: integer
        required: true
        description: Numeric ID of the branch to get
      - in: query
        name: device_id
        schema:
          type: integer
        required: true
        description: Numeric ID of the device
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
  /api/charge-accounts/{branchId}:
    get:
      tags:
      - Cashier
      summary: Get charge accounts
      description: |
        Used by: Cashier. Download charge/AR account list used for charge payments.
      parameters:
      - in: path
        name: branchId
        schema:
          type: integer
        required: true
        description: Numeric ID of the branch to get
      - in: query
        name: device_id
        schema:
          type: integer
        required: true
        description: Numeric ID of the device
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
  /api/price-change-reasons/{branchId}:
    get:
      tags:
      - Cashier
      summary: Get price change reasons
      description: |
        Used by: Cashier. Download reasons allowed when changing product price on cashier.
      parameters:
      - in: path
        name: branchId
        schema:
          type: integer
        required: true
        description: Numeric ID of the branch to get
      - in: query
        name: device_id
        schema:
          type: integer
        required: true
        description: Numeric ID of the device
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
  /api/branch-products/{branchId}:
    get:
      tags:
      - Cashier & Order Station
      summary: Get branch products
      description: |
        Used by: Cashier & Order Station. Download product catalog for the branch.
      parameters:
      - in: path
        name: branchId
        schema:
          type: integer
        required: true
        description: Numeric ID of the branch to get
      - in: query
        name: device_id
        schema:
          type: integer
        required: true
        description: Numeric ID of the device
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
  /api/branch-take-order-transactions:
    get:
      tags:
      - Cashier & Order Station
      summary: Get take-order transactions
      description: |
        Used by: Cashier & Order Station. Download take-order (order station) transactions for sync between machines.
      parameters:
      - in: query
        name: branch_id
        schema:
          type: integer
        required: true
        description: Numeric ID of the branch to get
      - in: query
        name: device_id
        schema:
          type: integer
        required: true
        description: Numeric ID of the device
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
    post:
      tags:
      - Order Station
      summary: Upload take-order transactions
      description: |
        Used by: Order Station. Upload take-order transactions created on the order station.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                device_id:
                  type: integer
                  description: POS device ID required by MachineValidationMiddleware (body or query).
                transaction_id:
                  type: integer
                pos_machine_id:
                  type: integer
                control_number:
                  type: string
                receipt_number:
                  type: string
                gross_sales:
                  type: number
                net_sales:
                  type: number
                vatable_sales:
                  type: number
                vat_exempt_sales:
                  type: number
                vat_amount:
                  type: number
                discount_amount:
                  type: number
                tender_amount:
                  type: number
                change:
                  type: number
                service_charge:
                  type: number
                type:
                  type: string
                cashier_id:
                  type: integer
                cashier_name:
                  type: string
                take_order_id:
                  type: integer
                take_order_name:
                  type: string
                total_unit_cost:
                  type: number
                total_void_amount:
                  type: number
                shift_number:
                  type: integer
                is_void:
                  type: boolean
                void_by_id:
                  type: integer
                void_by:
                  type: string
                void_at:
                  type: string
                  nullable: true
                is_back_out:
                  type: boolean
                is_back_out_id:
                  type: boolean
                back_out_by:
                  type: string
                charge_account_id:
                  type: integer
                charge_account_name:
                  type: string
                is_account_receivable:
                  type: boolean
                is_sent_to_server:
                  type: boolean
                is_complete:
                  type: boolean
                completed_at:
                  type: string
                  nullable: true
                is_cut_off:
                  type: boolean
                cut_off_id:
                  type: integer
                cut_off_at:
                  type: string
                  nullable: true
                branch_id:
                  type: integer
                guest_name:
                  type: string
                is_resume_printed:
                  type: boolean
                treg:
                  type: string
                  nullable: true
                backout_at:
                  type: string
                  nullable: true
                total_quantity:
                  type: integer
                total_void_qty:
                  type: integer
                vat_expense:
                  type: number
                is_return:
                  type: boolean
                total_cash_amount:
                  type: number
                total_return_amount:
                  type: number
                void_counter:
                  type: integer
                void_remarks:
                  type: string
                customer_name:
                  type: string
                company_id:
                  type: integer
                account_receivable_redeem_at:
                  type: string
                  nullable: true
                is_account_receivable_redeem:
                  type: boolean
                total_zero_rated_amount:
                  type: number
                remarks:
                  type: string
                is_advance_order:
                  type: boolean
              required:
              - device_id
              - transaction_id
              - pos_machine_id
              - gross_sales
              - net_sales
              - vatable_sales
              - vat_exempt_sales
              - vat_amount
              - discount_amount
              - tender_amount
              - change
              - service_charge
              - cashier_id
              - total_unit_cost
              - total_void_amount
              - is_void
              - is_back_out
              - is_account_receivable
              - is_sent_to_server
              - is_complete
              - is_cut_off
              - branch_id
              - total_quantity
              - total_void_qty
              - vat_expense
              - is_return
              - total_cash_amount
              - total_return_amount
              - void_counter
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
  /api/branch-transactions:
    get:
      tags:
      - Cashier
      summary: Get cashier transactions
      description: |
        Used by: Cashier. Download cashier sales transactions for multi-machine sync.
      parameters:
      - in: query
        name: branch_id
        schema:
          type: integer
        required: true
        description: Numeric ID of the branch to get
      - in: query
        name: pos_machine_id
        schema:
          type: integer
        required: true
        description: ID of the machine to get
      - in: query
        name: device_id
        schema:
          type: integer
        required: true
        description: Numeric ID of the device
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
    post:
      tags:
      - Cashier
      summary: Upload cashier transactions
      description: |
        Used by: Cashier. Upload cashier sales transactions to the server.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: 'Bulk sync payload. Preferred: `{ device_id, data: [item, ...] }`. Also accepts a single item object,
                or a raw JSON array (pass device_id as query param).'
              required:
              - device_id
              - data
              properties:
                device_id:
                  type: integer
                  description: POS device ID required by MachineValidationMiddleware (body or query).
                data:
                  type: array
                  items:
                    type: object
                    properties:
                      transaction_id:
                        type: integer
                      pos_machine_id:
                        type: integer
                      control_number:
                        type: string
                      receipt_number:
                        type: string
                      gross_sales:
                        type: number
                      net_sales:
                        type: number
                      vatable_sales:
                        type: number
                      vat_exempt_sales:
                        type: number
                      vat_amount:
                        type: number
                      discount_amount:
                        type: number
                      tender_amount:
                        type: number
                      change:
                        type: number
                      service_charge:
                        type: number
                      type:
                        type: string
                      cashier_id:
                        type: integer
                      cashier_name:
                        type: string
                      take_order_id:
                        type: integer
                      take_order_name:
                        type: string
                      total_unit_cost:
                        type: number
                      total_void_amount:
                        type: number
                      shift_number:
                        type: integer
                      is_void:
                        type: boolean
                      void_by_id:
                        type: integer
                      void_by:
                        type: string
                      void_at:
                        type: string
                        nullable: true
                      is_back_out:
                        type: boolean
                      is_back_out_id:
                        type: boolean
                      back_out_by:
                        type: string
                      charge_account_id:
                        type: integer
                      charge_account_name:
                        type: string
                      is_account_receivable:
                        type: boolean
                      is_sent_to_server:
                        type: boolean
                      is_complete:
                        type: boolean
                      completed_at:
                        type: string
                        nullable: true
                      is_cut_off:
                        type: boolean
                      cut_off_id:
                        type: integer
                      cut_off_at:
                        type: string
                        nullable: true
                      branch_id:
                        type: integer
                      guest_name:
                        type: string
                      is_resume_printed:
                        type: boolean
                      treg:
                        type: string
                        nullable: true
                      backout_at:
                        type: string
                        nullable: true
                      total_quantity:
                        type: integer
                      total_void_qty:
                        type: integer
                      vat_expense:
                        type: number
                      is_return:
                        type: boolean
                      total_cash_amount:
                        type: number
                      total_return_amount:
                        type: number
                      void_counter:
                        type: integer
                      void_remarks:
                        type: string
                      customer_name:
                        type: string
                      total_zero_rated_amount:
                        type: number
                      company_id:
                        type: integer
                      is_account_receivable_redeem:
                        type: boolean
                      account_receivable_redeem_at:
                        type: string
                        nullable: true
                      remarks:
                        type: string
                      is_advance_order:
                        type: boolean
                    required:
                    - transaction_id
                    - pos_machine_id
                    - gross_sales
                    - net_sales
                    - vatable_sales
                    - vat_exempt_sales
                    - vat_amount
                    - discount_amount
                    - tender_amount
                    - change
                    - service_charge
                    - cashier_id
                    - total_unit_cost
                    - total_void_amount
                    - is_void
                    - is_back_out
                    - is_account_receivable
                    - is_sent_to_server
                    - is_complete
                    - is_cut_off
                    - branch_id
                    - total_quantity
                    - total_void_qty
                    - vat_expense
                    - is_return
                    - total_cash_amount
                    - total_return_amount
                    - void_counter
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
  /api/branch-orders:
    get:
      tags:
      - Cashier
      summary: Get cashier orders
      description: |
        Used by: Cashier. Download cashier order line items for multi-machine sync.
      parameters:
      - in: query
        name: branch_id
        schema:
          type: integer
        required: true
        description: Numeric ID of the branch to get
      - in: query
        name: pos_machine_id
        schema:
          type: integer
        required: true
        description: ID of the machine to get
      - in: query
        name: device_id
        schema:
          type: integer
        required: true
        description: Numeric ID of the device
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
    post:
      tags:
      - Cashier
      summary: Upload cashier orders
      description: |
        Used by: Cashier. Upload cashier order line items to the server.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: 'Bulk sync payload. Preferred: `{ device_id, data: [item, ...] }`. Also accepts a single item object,
                or a raw JSON array (pass device_id as query param).'
              required:
              - device_id
              - data
              properties:
                device_id:
                  type: integer
                  description: POS device ID required by MachineValidationMiddleware (body or query).
                data:
                  type: array
                  items:
                    type: object
                    properties:
                      order_id:
                        type: integer
                      pos_machine_id:
                        type: integer
                      transaction_id:
                        type: integer
                      product_id:
                        type: integer
                      code:
                        type: string
                      name:
                        type: string
                      description:
                        type: string
                      abbreviation:
                        type: string
                      cost:
                        type: number
                      qty:
                        type: integer
                      amount:
                        type: number
                      original_amount:
                        type: number
                      gross:
                        type: number
                      total:
                        type: number
                      total_cost:
                        type: number
                      is_vatable:
                        type: boolean
                      vat_amount:
                        type: number
                      vatable_sales:
                        type: number
                      vat_exempt_sales:
                        type: number
                      discount_amount:
                        type: number
                      department_id:
                        type: integer
                      department_name:
                        type: string
                      category_id:
                        type: integer
                      category_name:
                        type: string
                      subcategory_id:
                        type: integer
                      subcategory_name:
                        type: string
                      unit_id:
                        type: integer
                      unit_name:
                        type: string
                      is_void:
                        type: boolean
                      void_by:
                        type: string
                      void_at:
                        type: string
                        nullable: true
                      is_back_out:
                        type: boolean
                      is_back_out_id:
                        type: boolean
                      back_out_by:
                        type: string
                      min_amount_sold:
                        type: number
                      is_paid:
                        type: boolean
                      is_sent_to_server:
                        type: boolean
                      is_completed:
                        type: boolean
                      completed_at:
                        type: string
                        nullable: true
                      branch_id:
                        type: integer
                      shift_number:
                        type: integer
                      is_cut_off:
                        type: boolean
                      cut_off_id:
                        type: integer
                      cut_off_at:
                        type: string
                        nullable: true
                      discount_details_id:
                        type: integer
                      treg:
                        type: string
                        nullable: true
                      is_discount_exempt:
                        type: boolean
                      is_open_price:
                        type: boolean
                      remarks:
                        type: string
                      vat_expense:
                        type: number
                      with_serial:
                        type: boolean
                      is_return:
                        type: boolean
                      serial_number:
                        type: string
                      is_zero_rated:
                        type: boolean
                      zero_rated_amount:
                        type: number
                      price_change_reason_id:
                        type: integer
                      company_id:
                        type: integer
                      is_free:
                        type: boolean
                      part_number:
                        type: string
                      is_bundle:
                        type: boolean
                      bundle_order_id:
                        type: integer
                      is_posted:
                        type: boolean
                      parent_order_id:
                        type: integer
                    required:
                    - order_id
                    - pos_machine_id
                    - transaction_id
                    - product_id
                    - cost
                    - qty
                    - amount
                    - original_amount
                    - gross
                    - total
                    - total_cost
                    - is_vatable
                    - vat_amount
                    - vatable_sales
                    - vat_exempt_sales
                    - discount_amount
                    - department_id
                    - category_id
                    - subcategory_id
                    - unit_id
                    - is_void
                    - is_back_out
                    - min_amount_sold
                    - is_paid
                    - is_sent_to_server
                    - is_completed
                    - branch_id
                    - is_cut_off
                    - is_discount_exempt
                    - is_open_price
                    - vat_expense
                    - with_serial
                    - is_return
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
  /api/branch-take-order-orders:
    get:
      tags:
      - Cashier & Order Station
      summary: Get take-order orders
      description: |
        Used by: Cashier & Order Station. Download take-order line items for sync between machines.
      parameters:
      - in: query
        name: branch_id
        schema:
          type: integer
        required: true
        description: Numeric ID of the branch to get
      - in: query
        name: transaction_id
        schema:
          type: integer
        description: Optional transaction ID filter
        required: false
      - in: query
        name: pos_machine_id
        schema:
          type: integer
        required: false
        description: Optional POS machine ID filter
      - in: query
        name: device_id
        schema:
